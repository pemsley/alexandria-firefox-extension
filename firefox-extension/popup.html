<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      body {
        font: 13px system-ui, sans-serif;
        margin: 0;
        padding: 8px;
        min-width: 320px;
      }
      h1 {
        font-size: 13px;
        font-weight: 600;
        margin: 0 0 8px;
      }
      ul {
        list-style: none;
        padding: 0;
        margin: 0;
      }
      li button {
        display: block;
        width: 100%;
        text-align: left;
        background: none;
        border: 1px solid transparent;
        padding: 6px 8px;
        border-radius: 4px;
        cursor: pointer;
        font: inherit;
        word-break: break-all;
      }
      li button:hover {
        background: #eef;
        border-color: #99c;
      }
      .status {
        margin-top: 8px;
        color: #555;
      }
      .status.error {
        color: #a00;
      }
      .progress {
        display: flex;
        align-items: center;
        gap: 8px;
        margin-top: 8px;
      }
      /* A <progress> with no value renders as an indeterminate animation,
         which is what tells "waiting on the server" from "downloading". */
      .progress progress {
        flex: 1;
        height: 8px;
      }
      .progress .detail {
        color: #555;
        font-variant-numeric: tabular-nums;
        white-space: nowrap;
      }
    </style>
  </head>
  <body>
    <h1>Save to Alexandria</h1>
    <ul id="list"></ul>
    <div class="status" id="status"></div>
    <div class="progress" id="progress" hidden>
      <progress id="bar" max="100"></progress>
      <span class="detail" id="detail"></span>
    </div>
    <script src="popup.js"></script>
  </body>
</html>
